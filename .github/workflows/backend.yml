# Integración continua del backend.
#
# El plan la pide para el día 12 con un criterio concreto: "el build de CI falla si un diagrama
# de referencia no compila". Eso no es una metáfora — el arnés del generador escribe el código
# de cada diagrama de referencia, lo compila de verdad con javax.tools.JavaCompiler y valida el
# mapeo JPA con Hibernate. Si alguna de esas cosas se rompe, este flujo se pone en rojo.
#
# POR QUÉ IMPORTA, con un ejemplo que ya pasó: el generador emitía @ManyToOne(mappedBy = "..."),
# que no existe en JPA, y el ZIP no compilaba. Sobrevivió semanas porque los tres diagramas de
# referencia estaban escritos a mano con el owningSide correcto y lo tapaban, y porque la suite
# sólo corría cuando alguien se acordaba. Lo primero se arregló agregando un caso que contradice
# a propósito; lo segundo se arregla acá.
#
# NO VERIFICADO, y ahora por partida doble: este archivo nunca se ejecutó. GitHub Actions sólo corre en el servidor de
# GitHub y el push lo hace Daniel, así que hasta el primer push esto está escrito y no probado.
# Lo que SÍ está comprobado en la máquina de desarrollo es todo lo que el flujo ejecuta: el
# comando exacto de Maven, que la suite no necesita PostgreSQL, y que sin JWT_SECRET la
# aplicación se niega a arrancar (por eso el paso que lo genera).
#
# Lo que se AGREGÓ sin verificar es el servicio de PostgreSQL y el `-Dalta-real=true`. El arnés
# de alta real SÍ está comprobado —corre en esta máquina contra el PostgreSQL local y crea las
# cinco entidades de la veterinaria— pero que funcione *acá dentro*, contra un contenedor y con
# el healthcheck de abajo, no lo vio nadie. Es complejidad no probada encima de algo no probado,
# y conviene tenerlo presente cuando la primera corrida falle: el primer sospechoso es esto.

name: backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Para poder dispararlo a mano desde la pestaña Actions sin tener que inventar un commit.
  workflow_dispatch:

# Un push encima de otro cancela el anterior: en una rama con varios commits seguidos, lo único
# que interesa es si el último está bien.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compila y pasa la suite
    runs-on: ubuntu-latest
    # La suite tarda ~2 minutos; con 15 se corta sola si algo queda colgado en vez de consumir
    # la hora entera que da el valor por defecto.
    timeout-minutes: 15

    # PostgreSQL para el arnés de alta real, que levanta el backend generado y le hace un POST.
    #
    # Va como `services` y no como un `docker run` en un paso: así GitHub Actions ESPERA a que el
    # healthcheck pase antes de correr nada. Arrancándolo a mano, la suite empieza antes de que la
    # base acepte conexiones y falla con un error de red que no se parece en nada a "todavía no
    # estaba lista" — y eso manda a buscar el problema al lugar equivocado.
    #
    # Usuario, clave y puerto son los mismos que en la máquina de desarrollo, que es lo que el
    # arnés espera encontrar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345678
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          # Cachea ~/.m2 usando pom.xml como clave. Sin esto cada corrida vuelve a bajar todas
          # las dependencias, que es la mayor parte del tiempo del build.
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Suite completa
        working-directory: backend
        env:
          # Hace falta de verdad: JwtService se niega a construirse sin secreto, a propósito,
          # para que un despliegue que se olvide de configurarlo no arranque firmando con una
          # clave publicada. Se genera uno al vuelo y distinto en cada corrida — no hay ninguna
          # razón para que la CI tenga un secreto estable, y uno fijo acá terminaría copiado a
          # un despliegue real.
          JWT_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-clave-efimera-hs256-32b
        # La suite en sí NO necesita PostgreSQL —no hay ningún @SpringBootTest ni @DataJpaTest,
        # los repositorios van mockeados y el arnés de mapeo usa MetadataSources de Hibernate, que
        # valida sin conectarse— y eso está comprobado corriendo los 385 contra un puerto muerto.
        #
        # El que SÍ lo necesita es el alta real: levanta el backend generado contra una base y le
        # hace un POST por entidad. Es el único arnés que ejercita lo que compila, mapea bien y
        # muere en el primer insert.
        #
        # Por eso se activa acá y no en local: cuesta ~25 s por diagrama, y en una suite que tarda
        # dos minutos eso es la diferencia entre correr los tests siempre y dejar de correrlos.
        run: |
          sed -i 's/\r$//' ./mvnw src/main/resources/generator/wrapper/mvnw
          chmod +x ./mvnw
          ./mvnw -B clean test -Dalta-real=true

      - name: Informes de las pruebas
        # Con `always()` los informes se suben también cuando la suite falla, que es justo cuando
        # hacen falta: si sólo se subieran en verde, para diagnosticar un rojo habría que
        # reproducirlo a mano en otra máquina.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
