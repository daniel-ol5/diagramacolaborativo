# ModelCollab :: Nginx NATIVO en Windows, sin Docker.
#
# ## PARA QUÉ EXISTE
#
# Para que tener algo publicado no dependa de un reinicio de Windows. Docker
# Desktop necesita WSL2, WSL2 necesita dos características de Windows, y eso
# necesita reiniciar. **Nginx para Windows es un zip portable**: no se instala,
# no pide permisos y no pide reiniciar.
#
# El stack ya existe sin Docker: el backend corre con `./mvnw spring-boot:run` y
# PostgreSQL está instalado en la máquina. Lo único que faltaba era **algo que
# unificara el origen** — que sirva el frontend construido y haga de
# intermediario para `/api` y `/ws`. Eso es este archivo.
#
# **No reemplaza a Docker.** El despliegue en la instancia lo necesita igual.
#
# ## DERIVADO DE modelcollab-sin-tls.conf — QUÉ CAMBIÓ Y POR QUÉ
#
# Los bloques `location` son los mismos, a propósito: el `try_files` que salva
# los enlaces de invitación, el `proxy_read_timeout` de 3600 s, las cabeceras de
# Upgrade y el `proxy_buffering off`. Lo que cambió es sólo lo que no puede ser
# igual fuera de un contenedor:
#
#   1. **`proxy_pass` va a `127.0.0.1:8080` y no a `backend:8080`.** `backend`
#      es el nombre del servicio en la red interna de Docker y acá no resuelve.
#   2. **Es un nginx.conf COMPLETO**, con `events` y `http`. El de Docker es un
#      fragmento que se deja caer en `conf.d/`, donde el `http` ya lo pone la
#      imagen.
#   3. **`root` apunta al `web/dist` del repositorio**, no a
#      `/usr/share/nginx/html`, porque no hay volumen que montar.
#   4. **Escucha en 8091 y no en 80.** En Windows el 80 suele estar tomado, y el
#      8090 es el del ensayo con Docker: así las dos variantes pueden convivir.
#   5. **Se fue el bloque de `/.well-known/acme-challenge/`.** Por este camino no
#      se emite ningún certificado: el TLS lo pone el túnel.
#
# ## USO
#
#   # 1. Poner las dos rutas reales (una sola vez). Son DOS marcadores:
#   #    dónde está el repositorio y dónde se descomprimió Nginx.
#   sed -i "s|RUTA_DEL_REPO|$(pwd)|g" deploy/nginx/modelcollab-local-windows.conf
#   sed -i "s|RUTA_DE_NGINX|/ruta/a/nginx-1.27.4|g" deploy/nginx/modelcollab-local-windows.conf
#
#   # 2. Construir el frontend si no está
#   (cd web && npm ci && npm run build)
#
#   # 3. Levantar Nginx apuntando el prefijo a SU carpeta, para que los logs y
#   #    los temporales no caigan dentro del repositorio
#   nginx.exe -p /ruta/a/nginx-1.27.4/ -c /ruta/absoluta/modelcollab-local-windows.conf
#
#   # Para bajarlo:
#   nginx.exe -p /ruta/a/nginx-1.27.4/ -s stop

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # La ruta va completa a propósito: un `include mime.types;` a secas se
    # resuelve contra la carpeta del archivo de configuración, no contra el
    # prefijo, y como este archivo vive en el repositorio y no dentro de Nginx,
    # no lo encuentra. El error que da —"CreateFile() ... failed"— no sugiere en
    # ningún momento que el problema sea desde dónde se resuelve la ruta.
    include       RUTA_DE_NGINX/conf/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 8091;
        server_name localhost;

        # Fotos de celular: CU17 acepta hasta 8 MB y Spring está configurado con
        # 10 de archivo y 12 de petición. El valor por defecto de Nginx es 1 MB,
        # así que sin esta línea toda foto muere acá con un 413 sin cuerpo,
        # antes de llegar a la aplicación y al mensaje que explica qué pasó.
        client_max_body_size 12m;

        # ------------------------------------------------------------ WebSocket
        #
        # Las tres líneas de Upgrade/Connection/HTTP 1.1 son obligatorias: sin
        # ellas Nginx trata el WebSocket como una petición HTTP normal, el
        # handshake no se completa y el lienzo queda sin colaboración — con un
        # error que no dice "falta el upgrade" sino simplemente "no conecta".
        #
        # Los tiempos largos son la SEGUNDA línea de defensa. Lo que de verdad
        # mantiene viva la conexión son los latidos del broker cada 10 s
        # (medido: 10.0, 10.0, 10.0 s); esto cubre el día que alguien toque esa
        # configuración sin saber que hay algo que depende de ella.
        location /ws {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Los frames salen cuando salen, no cuando se llene un buffer.
            proxy_buffering off;
        }

        # ----------------------------------------------------------------- API
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Generar el ZIP de un diagrama grande y leer una foto con el modelo
            # multimodal tardan más que una petición normal.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ------------------------------------------------------------ Frontend
        location / {
            root RUTA_DEL_REPO/web/dist;

            # ESTA LÍNEA NO SE BORRA. Es una aplicación de una sola página: el
            # navegador pide /invite/abc123 y en el disco no existe ningún
            # archivo con ese nombre. Sin el respaldo a index.html, Nginx
            # devuelve 404 y TODOS LOS ENLACES DE INVITACIÓN QUEDAN ROTOS — que
            # es la única puerta por la que entra un colaborador nuevo, y que
            # siempre se abre en frío.
            #
            # En desarrollo funciona igual sin esto, porque el servidor de Vite
            # devuelve index.html para cualquier ruta. O sea que el síntoma
            # aparece SÓLO servido así, y recién cuando alguien entra por
            # primera vez.
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
            root RUTA_DEL_REPO/web/dist;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            root RUTA_DEL_REPO/web/dist;
            add_header Cache-Control "no-store";
        }
    }
}
