# ModelCollab :: Nginx SIN TLS — la red de seguridad para el día del despliegue.
#
# ============================ NO VERIFICADO ============================
# Nunca se ejecutó. No hay Docker en la máquina de desarrollo (D-01).
# =======================================================================
#
# ## PARA QUÉ EXISTE ESTE ARCHIVO
#
# El certificado es el paso con más formas de fallar de todo el despliegue, y
# varias no dependen de nosotros: que el DNS no haya propagado, que el grupo de
# seguridad de AWS no deje entrar al puerto 80, que Let's Encrypt limite los
# reintentos después de cinco intentos fallidos en una hora.
#
# Si eso pasa a las once de la noche del día anterior a la entrega, la
# diferencia entre "no hay demostración" y "hay demostración con una
# limitación" es tener esta configuración escrita DE ANTEMANO. Por eso está
# acá antes de hacer falta y no se escribe en el momento.
#
# ## QUÉ SE PIERDE, DICHO SIN ADORNOS
#
#   * **El dictado por voz en el navegador deja de funcionar.** getUserMedia()
#     sólo existe en un contexto seguro: sin HTTPS, Chrome y Firefox no dan
#     acceso al micrófono y no hay forma de convencerlos. CU16 por voz muere.
#   * El navegador marca el sitio como "No seguro".
#   * Las credenciales viajan en claro. En una demostración de aula es
#     aceptable; para cualquier otra cosa, no.
#
# ## QUÉ SIGUE FUNCIONANDO, QUE ES CASI TODO
#
#   * El modelado colaborativo entero, con WebSocket sobre ws:// en vez de wss.
#   * CU16 **escribiendo** el comando en vez de dictándolo. El cuadro de texto
#     acepta exactamente las mismas órdenes: lo que se pierde es el micrófono,
#     no el asistente.
#   * CU17, la importación desde una foto, incluida la captura desde el celular.
#   * La generación del backend y de la app móvil, la validación y el XMI.
#   * **La app móvil graba igual.** No depende del contexto seguro del
#     navegador: es una aplicación nativa y pide el permiso de micrófono al
#     sistema operativo. O sea que si hay que demostrar voz sin certificado, se
#     demuestra desde el teléfono.
#
# ## CÓMO SE USA
#
# En deploy/docker-compose.prod.yml, cambiar el montaje de la configuración de
# Nginx para que apunte a este archivo en lugar de a modelcollab.conf, y quitar
# el montaje de /etc/letsencrypt (que no existe). Después:
#
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Y avisarle a quien mantiene web/ que el cliente tiene que hablar http:// y
# ws://, no https:// y wss://.
#
# NO hace falta reemplazar ningún dominio: server_name _ atiende cualquier
# nombre, así que esto funciona incluso con la IP pelada de la instancia, que
# es justamente el caso en el que uno termina acá.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Se deja igual que en la configuración con TLS: si el certificado se llega
    # a emitir más tarde, el desafío tiene que poder pasar sin tocar nada.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 12m;

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        # Sin esto, todos los enlaces de invitación devuelven 404. Ver la nota
        # larga en modelcollab.conf: es el error que sólo aparece desplegado y
        # justo delante de la persona a la que estás invitando.
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
}
