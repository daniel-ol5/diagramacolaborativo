# ModelCollab :: Nginx con terminación TLS y paso de WebSocket.
#
# ============================ NO VERIFICADO ============================
# Nunca se ejecutó. No hay Docker en la máquina de desarrollo (D-01).
# =======================================================================
#
# Reemplazar DOMINIO.EJEMPLO por el dominio real antes de levantar. Aparece
# cuatro veces; el instructivo tiene el sed.

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO.EJEMPLO;

    # ÚNICA excepción al redirect: el desafío de Let's Encrypt. Certbot escribe
    # un archivo acá y espera que se sirva por HTTP plano. Si esto se redirige
    # a HTTPS, la renovación automática falla y el certificado vence a los 90
    # días — con el síntoma apareciendo tres meses después del despliegue.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------- HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMINIO.EJEMPLO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO.EJEMPLO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO.EJEMPLO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # El tamaño de subida: CU17 acepta fotos de hasta 8 MB y Spring está
    # configurado con 10 MB de archivo y 12 MB de petición. El valor por
    # defecto de Nginx es 1 MB, así que SIN esta línea toda foto de celular
    # muere acá con un 413 de Nginx —antes de llegar a la aplicación— y el
    # usuario no ve el mensaje que explica qué pasó. Es el mismo error que ya
    # tuvimos del lado de Spring, una capa más arriba.
    client_max_body_size 12m;

    # ------------------------------------------------------------ WebSocket
    #
    # Esto es lo que más se equivoca en este despliegue, así que va explicado.
    #
    # Las tres líneas de Upgrade/Connection/HTTP 1.1 son obligatorias: sin
    # ellas Nginx trata el WebSocket como una petición HTTP normal, el
    # handshake no se completa y el lienzo queda sin colaboración — con un
    # error que no dice "falta el upgrade" sino simplemente "no conecta".
    #
    # Sobre los TIEMPOS DE ESPERA, que es donde está la trampa clásica: el
    # valor por defecto de proxy_read_timeout es 60 s, y una sala en la que
    # nadie toca nada durante un minuto se cortaría sola. El síntoma es
    # "la colaboración se cae cada minuto" y no se parece en nada a su causa.
    #
    # NO es lo que nos salva hoy, y conviene tenerlo claro para no confiar en
    # la línea equivocada: el broker STOMP manda latidos cada 10 segundos
    # (medido: 10.0, 10.0, 10.0 s), así que la conexión nunca está inactiva 60
    # segundos y el valor por defecto ya alcanzaría. Subir el tiempo de espera
    # es la SEGUNDA línea de defensa, para el día que alguien toque la
    # configuración de latidos sin saber que esto depende de ella.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Los frames tienen que salir cuando salen, no cuando se llene un
        # buffer: con buffering, un mensaje de 200 bytes puede quedar esperando
        # y la colaboración "en tiempo real" llega a destiempo.
        proxy_buffering off;
    }

    # ----------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generar el ZIP de un diagrama grande y leer una foto con el modelo
        # multimodal tardan más que una petición normal.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------ Frontend
    #
    # El build de Vite servido como estático. Que la web y la API salgan del
    # MISMO origen no es casualidad: así no hay CORS que configurar, ni
    # cookies de terceros, ni una lista de orígenes permitidos que mantener.
    # Es la simplificación que compra servir las dos cosas desde Nginx.
    location / {
        root /usr/share/nginx/html;

        # ESTA LÍNEA NO SE BORRA. Es una aplicación de una sola página: el
        # navegador pide /invite/abc123 y en el disco no existe ningún archivo
        # con ese nombre. Sin el respaldo a index.html, Nginx devuelve 404 y
        # TODOS LOS ENLACES DE INVITACIÓN QUEDAN ROTOS — que es la única puerta
        # por la que entra un colaborador nuevo, y que siempre se abre en frío:
        # nadie llega ahí navegando, lo recibe por chat y lo pega.
        #
        # En desarrollo funciona igual sin esto, porque el servidor de Vite
        # devuelve index.html para cualquier ruta. O sea que el síntoma aparece
        # SÓLO desplegado, y recién cuando alguien intenta entrar por primera
        # vez. Es la peor combinación posible: invisible mientras se desarrolla
        # y visible delante del que estás invitando.
        try_files $uri $uri/ /index.html;
    }
    #
    # Y esto NO alcanza a /api/ ni a /ws: los dos tienen su propio bloque más
    # arriba, y Nginx elige el prefijo más largo que coincida. Importa que siga
    # siendo así — si una petición a una ruta inexistente de la API cayera acá,
    # el cliente recibiría el index.html con un 200 donde espera JSON, y el
    # error resultante ("Unexpected token < in JSON") no se parece en nada a su
    # causa. Si alguna vez se mueve o se borra alguno de esos bloques, este
    # respaldo se los come.

    # Los assets con hash en el nombre se pueden cachear para siempre; el
    # index.html nunca, o un despliegue nuevo no se ve hasta que el navegador
    # decida soltar el suyo.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
}
