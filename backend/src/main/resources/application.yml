spring:
  application:
    name: modelcollab-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/modelcollab}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # CU17 acepta fotos de hasta 8 MB y Spring cortaba en 1 MB (su valor por
      # defecto), asi que una foto de celular daba 413 con el cuerpo VACIO: el
      # validador no llegaba a correr y el usuario no recibia ningun mensaje.
      #
      # El limite se pone POR ENCIMA del que aplica VisionImageValidator, no
      # igual: asi un archivo de entre 8 y 10 MB llega hasta el validador y
      # recibe la explicacion de que le sobra y que baje la resolucion. Con los
      # dos limites iguales, el que hablaria seria Spring, con un 413 mudo.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

# JWT. NO hay valor por defecto, y es deliberado: sin JWT_SECRET la aplicacion no
# arranca. Antes habia uno y el comentario decia "no usar en produccion", pero eso
# no lo impedia — un despliegue que se olvidara de la variable levantaba perfecto
# firmando con una clave publicada en el repositorio, sin error y sin aviso.
#
# Para desarrollo local, exportala una vez:
#   export JWT_SECRET="$(openssl rand -base64 48)"
#
# HS256 exige al menos 32 bytes y JwtService lo valida al arrancar, en vez de
# fallar recien al firmar el primer token.
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

# CU16 y CU17. La clave NO tiene valor por defecto a proposito: sin ella la aplicacion
# arranca igual, en modo simulado, y lo dice en el log de arranque. Si no arrancara,
# el backend entero quedaria rehen de un servicio de terceros.
# Proveedor soportado: openai (por defecto) o gemini.
modelcollab:
  ai:
    provider: ${AI_PROVIDER:openai}
    api-key: ${OPENAI_API_KEY:${GEMINI_API_KEY:}}
    model: ${OPENAI_MODEL:${GEMINI_MODEL:gpt-4o-mini}}
    modelo-de-respaldo: ${OPENAI_MODELO_RESPALDO:${GEMINI_MODELO_RESPALDO:gpt-4o}}
    endpoint: ${OPENAI_ENDPOINT:${GEMINI_ENDPOINT:https://api.openai.com/v1}}
    timeout-ms: ${AI_TIMEOUT_MS:${GEMINI_TIMEOUT_MS:30000}}

  # CU19. Donde vive el historial del chat: "postgres" (por defecto, tablas de V4
  # en la misma base) o "memory", que no persiste nada y se pierde al reiniciar.
  chat:
    store: ${CHAT_STORE:postgres}

logging:
  level:
    com.modelcollab: DEBUG
