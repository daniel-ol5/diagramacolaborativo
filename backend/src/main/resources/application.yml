spring:
  application:
    name: modelcollab-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/modelcollab}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

# JWT. NO hay valor por defecto, y es deliberado: sin JWT_SECRET la aplicacion no
# arranca. Antes habia uno y el comentario decia "no usar en produccion", pero eso
# no lo impedia — un despliegue que se olvidara de la variable levantaba perfecto
# firmando con una clave publicada en el repositorio, sin error y sin aviso.
#
# Para desarrollo local, exportala una vez:
#   export JWT_SECRET="$(openssl rand -base64 48)"
#
# HS256 exige al menos 32 bytes y JwtService lo valida al arrancar, en vez de
# fallar recien al firmar el primer token.
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

# CU16. La clave NO tiene valor por defecto a proposito: sin ella la aplicacion
# arranca igual, en modo simulado, y lo dice en el log de arranque. Si no arrancara,
# el backend entero quedaria rehen de un servicio de terceros.
modelcollab:
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta}
    timeout-ms: ${GEMINI_TIMEOUT_MS:8000}

logging:
  level:
    com.modelcollab: DEBUG
