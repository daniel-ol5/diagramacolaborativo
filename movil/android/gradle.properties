# El techo por defecto (-Xmx8G) pide un pico que esta maquina de desarrollo
# (14 GB, tres sesiones de Claude en paralelo, un backend Java y un
# navegador) no siempre puede dar sin que el sistema mate el build por
# memoria baja -- nos paso mas de una vez el 20/09. Bajado a un valor que
# entra con holgura; compila mas lento, pero termina.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Sin demonio: cada build arranca y cierra su propia JVM, asi que no queda
# nada vivo consumiendo memoria entre builds. Mas lento (arranca la JVM
# cada vez) pero es el intercambio correcto en esta maquina: preferimos
# builds mas lentos a demonios acumulados que hay que matar a mano
# (gradlew --stop) despues de cada intento.
org.gradle.daemon=false
android.useAndroidX=true
